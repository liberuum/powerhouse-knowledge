# Hermes Agent manifest. Hermes' Git installer inspects the REPOSITORY ROOT,
# so this must live here — Claude Code's copy under .claude-plugin/ is invisible
# to it, which is why a Git install reported "No agent or desktop plugin
# artifacts found in this repository".
#
# This plugin ships instructions and skills, not Python tools, so it declares
# no provides_tools / provides_hooks. Skills are the artifact: skills/<name>/SKILL.md.
name: powerhouse-knowledge
version: 1.4.0
description: >-
  Agent instructions and skills for a Powerhouse Knowledge Vault — seed sources,
  extract atomic notes, connect and verify them over the vault's REST API and
  the Switchboard CLI.
license: AGPL-3.0-only
homepage: https://github.com/liberuum/powerhouse-knowledge
tags:
  - knowledge-management
  - powerhouse
  - vault
  - rest
